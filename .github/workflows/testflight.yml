name: TestFlight Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Build Xcode Archive
        run: |
          xcodebuild -project Focal.xcodeproj \
                     -scheme Focal \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/Focal.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Export IPA & Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Exporting IPA and pushing to App Store Connect..."
          xcodebuild -exportArchive \
                     -archivePath build/Focal.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/ \
                     -allowProvisioningUpdates || true
          
          if [ -f "build/Focal.ipa" ]; then
            xcrun altool --upload-app --type ios --file "build/Focal.ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          else
            xcrun altool --upload-package "build/Focal.xcarchive" --type ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" || true
          fi
