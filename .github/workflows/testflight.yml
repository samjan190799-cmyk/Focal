name: TestFlight Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | openssl base64 -d -A > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Build Xcode Archive
        run: |
          xcodebuild -project Focal.xcodeproj \
                     -scheme Focal \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/Focal.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Import Signing Certificate & Sign App Bundle
        env:
          P12_BASE64: ""
          P12_PASSWORD: "123456"
        run: |
          echo "Packaging Focal.app into Focal.ipa..."
          mkdir -p build/Payload
          cp -R build/Focal.xcarchive/Products/Applications/Focal.app build/Payload/
          
          if [ -f "embedded.mobileprovision" ]; then
            echo "Embedding App Store provisioning profile..."
            cp embedded.mobileprovision build/Payload/Focal.app/embedded.mobileprovision
          fi

          echo "Importing p12 certificate into temporary Keychain..."
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          KEYCHAIN_PASSWORD=temp_password

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | openssl base64 -d -A > cert.p12
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')

          echo "Identities in Keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          echo "Signing Focal.app bundle..."
          codesign --force --deep --sign "Apple Distribution: Samvel Hayrapetyan (V7J345DY58)" build/Payload/Focal.app || \
          codesign --force --deep --sign "Apple Distribution" build/Payload/Focal.app || \
          codesign --force --deep --sign "Samvel Hayrapetyan" build/Payload/Focal.app || true

          cd build && zip -r Focal.ipa Payload

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading signed Focal.ipa to TestFlight via App Store Connect API..."
          xcrun altool --upload-app \
                       --type ios \
                       --file "build/Focal.ipa" \
                       --apiKey "$KEY_ID" \
                       --apiIssuer "$ISSUER_ID"
