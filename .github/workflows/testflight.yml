name: TestFlight Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Build Xcode Archive
        run: |
          xcodebuild -project Focal.xcodeproj \
                     -scheme Focal \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/Focal.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package App into IPA with Provisioning Profile
        run: |
          echo "Packaging Focal.app into Focal.ipa..."
          mkdir -p build/Payload
          cp -R build/Focal.xcarchive/Products/Applications/Focal.app build/Payload/
          
          if [ -f "embedded.mobileprovision" ]; then
            echo "Embedding App Store provisioning profile..."
            cp embedded.mobileprovision build/Payload/Focal.app/embedded.mobileprovision
          fi
          
          cd build && zip -r Focal.ipa Payload

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading Focal.ipa to TestFlight via App Store Connect API..."
          xcrun altool --upload-app \
                       --type ios \
                       --file "build/Focal.ipa" \
                       --apiKey "$KEY_ID" \
                       --apiIssuer "$ISSUER_ID"
