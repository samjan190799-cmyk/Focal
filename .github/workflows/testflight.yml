name: TestFlight Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Build and Sign Xcode Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -project Focal.xcodeproj \
                     -scheme Focal \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/Focal.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Export Signed IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/Focal.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/ \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "$KEY_ID" \
                     -authenticationKeyIssuerID "$ISSUER_ID" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" || \
          (mkdir -p build/Payload && cp -R build/Focal.xcarchive/Products/Applications/Focal.app build/Payload/ && cd build && zip -r Focal.ipa Payload)

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading Focal.ipa to TestFlight..."
          xcrun altool --upload-app \
                       --type ios \
                       --file "build/Focal.ipa" \
                       --apiKey "$KEY_ID" \
                       --apiIssuer "$ISSUER_ID"
